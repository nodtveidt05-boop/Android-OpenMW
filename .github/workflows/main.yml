name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CMAKE_VERSION: 3.18.4

    steps:
    - uses: actions/checkout@v4

    # Reuse the ARM native toolchain and compiled dependencies between runs.
    - name: Cache ARM native build
      uses: actions/cache@v4
      with:
        path: |
          buildscripts/downloads
          buildscripts/toolchain
          buildscripts/build/arm
          buildscripts/prefix/arm
        key: android-armv7-native-${{ runner.os }}-${{ hashFiles('buildscripts/CMakeLists.txt', 'buildscripts/build.sh', 'buildscripts/include/**', 'buildscripts/patches/**') }}

    # Gradle runs inside Docker as root, so mount and cache this directory.
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: android-armv7-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          android-armv7-gradle-${{ runner.os }}-

    - name: Install Android SDK 29
      shell: bash
      run: |
        set +o pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
        set -o pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-29" "build-tools;29.0.2"

    - name: Build ARM in Ubuntu 18.04
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -v "$ANDROID_HOME:/android-sdk" \
          -v "$HOME/.gradle:/root/.gradle" \
          -w /workspace \
          -e GITHUB_SHA="$GITHUB_SHA" \
          -e CMAKE_VERSION="$CMAKE_VERSION" \
          -e ANDROID_HOME=/android-sdk \
          -e ANDROID_SDK_ROOT=/android-sdk \
          ubuntu:18.04 bash -euo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential gcc-multilib python unzip pkg-config p7zip-full wget curl ca-certificates gettext-base openjdk-8-jdk git patch perl
            wget -q https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-Linux-x86_64.tar.gz -O /tmp/cmake.tar.gz
            tar -xzf /tmp/cmake.tar.gz -C /opt
            export PATH=/opt/cmake-$CMAKE_VERSION-Linux-x86_64/bin:$PATH

            cd buildscripts
            ./build.sh --arch arm
            cd ..

            ARCH=arm source buildscripts/include/version.sh
            sed -i "s/abiFilters.*/abiFilters '$ABI'/" app/build.gradle
            export ANDROID_NDK_HOME=$(pwd)/buildscripts/toolchain/ndk/
            ./gradlew assembleNightlyDebug

            cd buildscripts
            ./package-symbols.sh
            mv symbols.7z ../symbols-$(git rev-parse --short "$GITHUB_SHA")-arm.7z
            cd ..

            mv app/build/outputs/apk/nightly/debug/omw_debug_*.apk omw-debug-$(git rev-parse --short "$GITHUB_SHA")-arm.apk
          '

    - name: Upload ARM APK
      uses: actions/upload-artifact@v4
      with:
        name: omw-debug-arm
        path: omw-debug-*-arm.apk

    - name: Upload ARM symbols
      uses: actions/upload-artifact@v4
      with:
        name: symbols-arm
        path: symbols-*-arm.7z
